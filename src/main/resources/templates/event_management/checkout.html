<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Event Participants – Check-Out</title>

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/participants.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}" href="/css/footer.css">
</head>

<body class="participants-page">

<div th:if="${feedbackSaved}" class="feedback-popup">
    Feedback saved successfully!
</div>

<div th:if="${error}" class="feedback-error">
    <span th:text="${error}"></span>
</div>

<div th:replace="~{events/fragments/navbar :: navbar}"></div>

<div class="page-header">
    <h1>Event Participants</h1>
    <p th:text="'Event ID: ' + ${eventId}"></p>
</div>

<div class="fo-tabs">
    <a th:href="@{/event_management/participants(eventId=${eventId})}" class="fo-tab">
        Check-In
    </a>
    <a th:href="@{/event_management/checkout(eventId=${eventId})}" class="fo-tab active">
        Check-Out
    </a>
    <a th:href="@{/event_management/invoices(eventId=${eventId})}" class="fo-tab">
        Invoices
    </a>

    <a th:href="@{/event_management/feedback(eventId=${eventId})}" class="fo-tab">
        Feedback
    </a>
</div>

<div class="stats-container">
    <div class="stat-card">
        <span class="stat-title">Total</span>
        <span class="stat-value total" th:text="${totalCount}"></span>
    </div>

    <div class="stat-card">
        <span class="stat-title">Checked Out</span>
        <span class="stat-value arrived" th:text="${checkedOutCount}"></span>
    </div>

    <div class="stat-card">
        <span class="stat-title">Remaining</span>
        <span class="stat-value not-arrived" th:text="${remainingCount}"></span>
    </div>
</div>


<div class="search-container">
    <input type="text" class="search-input" placeholder="Search participant or booking…">
</div>

<div class="table-wrapper">
    <table class="participants-table">
        <thead>
        <tr>
            <th>Booking ID</th>
            <th>Booker</th>
            <th>Participant</th>
            <th>Age</th>
            <th>Participant Status</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="p : ${participants}"
            th:data-booking-id="${p.bookingId}"
            th:classappend="${p.checkedOut} ? 'checked-out' : ''">


        <td th:text="${p.bookingId}"></td>
            <td th:text="${p.bookerName}"></td>
            <td th:text="${p.participantName}"></td>
            <td th:text="${p.participantAge}"></td>

            <td>
                <span class="status-badge"
                      th:classappend="${p.checkedOut} ? 'expired' : 'paid'"
                      th:text="${p.checkedOut} ? 'CHECKED OUT' : 'CHECKED IN'">
                </span>
            </td>

            <td th:data-participant-id="${p.participantId}">

                <!-- noch nicht ausgecheckt -->
                <button th:if="${!p.checkedOut}" class="btn success checkout-btn">
                    Check out
                </button>

                <!-- ausgecheckt, aber kein Feedback -->
                <a th:if="${p.checkedOut and !p.feedbackExists}"
                   th:href="@{/feedback/new(participantId=${p.participantId}, eventId=${eventId})}"
                   class="feedback-btn">
                    Add feedback
                </a>

                <!-- Feedback existiert -->
                <span th:if="${p.checkedOut and p.feedbackExists}"
                      class="feedback-done">
                        Feedback submitted ✔
                </span>

            </td>


        </tr>
        </tbody>
    </table>
</div>

<div id="toast" class="toast"></div>

<div id="equipmentReturnModal" class="modal hidden">
    <div class="modal-content small">
        <div class="modal-header">
            <h3>Return Equipment</h3>
            <button class="modal-close" id="closeEquipmentModal">×</button>
        </div>

        <div class="modal-body">
            <p>Please confirm returned equipment:</p>
            <div id="equipmentReturnList"></div>
        </div>

        <div class="modal-footer">
            <button class="btn danger" id="cancelEquipmentReturn">Cancel</button>
            <button class="btn success" id="confirmEquipmentReturn">Confirm & Check-Out</button>
        </div>
    </div>
</div>


<script th:inline="javascript">
    const eventId = [[${eventId}]];
    const toast = document.getElementById("toast");

    function showToast(message, error = false) {
        toast.textContent = message;
        toast.style.background = error ? "#b42318" : "#1f7a4d";
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2500);
    }

    /* ZENTRALE UI-UPDATE-FUNKTION (EINMAL, FÜR ALLE CASES) */
    function updateRowAfterCheckout(row, participantId, btn) {
        row.classList.add("checked-out");

        const badge = row.querySelector(".status-badge");
        badge.textContent = "CHECKED OUT";
        badge.classList.remove("paid");
        badge.classList.add("expired");

        if (btn) btn.remove();

        const actionsCell = row.querySelector("td[data-participant-id]");
        if (!actionsCell.querySelector(".feedback-btn")) {
            const feedbackLink = document.createElement("a");
            feedbackLink.textContent = "Add feedback";
            feedbackLink.classList.add("feedback-btn");
            feedbackLink.href =
                `/feedback/new?participantId=${participantId}&eventId=${eventId}`;
            actionsCell.appendChild(feedbackLink);
        }

        const checkedOutEl = document.querySelector(".stat-value.arrived");
        const remainingEl = document.querySelector(".stat-value.not-arrived");

        checkedOutEl.textContent = Number(checkedOutEl.textContent) + 1;
        remainingEl.textContent = Number(remainingEl.textContent) - 1;
    }

    /*  NORMALER CHECKOUT (OHNE EQUIPMENT) */
    async function doCheckout(participantId, row, btn) {
        const res = await fetch(
            `/api/events/${eventId}/participants/${participantId}/checkout`,
            { method: "POST" }
        );

        const text = await res.text();

        if (!res.ok) {
            showToast(text || "Checkout failed", true);
            return;
        }

        updateRowAfterCheckout(row, participantId, btn);
        showToast("Participant checked out");
    }

    document.addEventListener("click", async (e) => {
        const btn = e.target.closest(".checkout-btn");
        if (!btn) return;

        const row = btn.closest("tr");
        const participantId =
            row.querySelector("td[data-participant-id]").dataset.participantId;

        const bookingId = row.dataset.bookingId;

        const res = await fetch(
            `/api/events/${eventId}/bookings/${bookingId}/equipment`
        );

        if (!res.ok) {
            showToast("Failed to load equipment", true);
            return;
        }

        const equipment = await res.json();

        if (equipment.length === 0) {
            await doCheckout(participantId, row, btn);
            return;
        }

        openEquipmentModal(equipment, participantId, row, btn);
    });


    /*  SEARCH */
    const searchInput = document.querySelector(".search-input");
    searchInput.addEventListener("input", () => {
        const query = searchInput.value.toLowerCase();
        document.querySelectorAll("tbody tr").forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(query) ? "" : "none";
        });
    });

    /* EQUIPMENT MODAL */
    const equipmentModal = document.getElementById("equipmentReturnModal");
    const equipmentList = document.getElementById("equipmentReturnList");

    function openEquipmentModal(equipment, participantId, row, btn) {
        equipmentList.innerHTML = "";

        equipment.forEach(e => {
            equipmentList.innerHTML += `
                <div class="equipment-return-card">
                    <div class="equipment-return-row">
                        <div class="equipment-left">
                            <div class="equipment-name">${e.name}</div>
                            <div class="equipment-qty">Quantity: x${e.quantity}</div>
                        </div>

                        <input
                            type="checkbox"
                            class="equipment-checkbox"
                            checked
                            data-id="${e.id}"
                        >
                    </div>
                </div>
            `;
        });

        equipmentModal.classList.remove("hidden");

        document.getElementById("confirmEquipmentReturn").onclick = async () => {
            const res = await fetch(
                `/api/events/${eventId}/participants/${participantId}/checkout-with-equipment?bookingId=${row.dataset.bookingId}`,
                { method: "POST" }
            );

            if (!res.ok) {
                showToast("Checkout with equipment failed", true);
                return;
            }

            equipmentModal.classList.add("hidden");
            updateRowAfterCheckout(row, participantId, btn);
            showToast("Participant checked out");
        };
    }

    document.getElementById("closeEquipmentModal").onclick =
        document.getElementById("cancelEquipmentReturn").onclick = () => {
            equipmentModal.classList.add("hidden");
        };

    /* FEEDBACK POPUP AUTO-HIDE */
    setTimeout(() => {
        const msg = document.querySelector(".feedback-popup");
        if (msg) {
            msg.style.opacity = "0";
            msg.style.transition = "opacity 0.4s ease";
            setTimeout(() => msg.remove(), 400);
        }
    }, 3000);
</script>

</body>
</html>
